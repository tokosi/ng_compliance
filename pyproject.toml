[project]
name = "ng_compliance"
authors = [{ name = "FEDCO West Africa Limited", email = "admin@example.com" }]
description = "Nigeria PAYE (Nigeria Tax Act 2025), statutory deductions, Nigerian accounting setup and ESS for ERPNext/Frappe HR v16"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
hrms = ">=16.0.0,<17.0.0"
